<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Mandi - Login / Register</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="login-container">

    <img src="https://digital-mandii-0.onrender.com/uploads/profile1.png" 
         alt="Digital Mandi Logo" class="logo">

    <h1>🌾 Digital Mandi</h1>
    <p>Login or Register to continue</p>

    <!-- Login Form -->
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <hr/>

    <!-- Register Form -->
    <form id="registerForm">
      <h3>New User? Register Here</h3>
      <input type="text" id="regName" placeholder="Full Name" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>

    <p class="note">Admin login is restricted. Only users can register here.</p>
  </div>

  <script type="module" src=".js/login.js></script>
</body>
</html>
