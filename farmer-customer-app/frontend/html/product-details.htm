<!DOCTYPE html>
<html>
<head><title>Product Details | Digital Mandii</title>
<meta name="description" content="Digital Mandii is India's trusted online marketplace for electronics, surplus products, fashion, grocery and more at best prices.">

<meta name="keywords" content="Digital Mandii, online shopping India, surplus products, electronics store, grocery online, affordable products India">

<meta name="author" content="Digital Mandii">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="index, follow">

<!-- Open Graph (Social Media) -->
<meta property="og:title" content="Digital Mandii - Online Marketplace">
<meta property="og:description" content="Shop quality products at best prices. Surplus deals available.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yourdomain.com">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2 style="text-align:center;padding:15px;background:#1e293b;color:white;">
  📦 Product Details
</h2>

<div id="details" style="padding:20px;text-align:center;"></div>

<script>
const API = "http://localhost:5000/api";
const id = localStorage.getItem("productId");

/* ===== Currency System ===== */
const currencyRates = {
  INR: 1,
  USD: 0.012,
  EUR: 0.011
};

const currencySymbols = {
  INR: "₹",
  USD: "$",
  EUR: "€"
};

const selectedCurrency = localStorage.getItem("currency") || "INR";

if(!id){
  document.getElementById("details").innerHTML = "Product not found ❌";
}else{

fetch(`${API}/products/${id}`)
.then(res => res.json())
.then(p => {

  const price = Number(p.price);
  const mrp = p.mrp ? Number(p.mrp) : null;

  const convertedPrice = (price * currencyRates[selectedCurrency]).toFixed(2);
  const convertedMrp = mrp ? (mrp * currencyRates[selectedCurrency]).toFixed(2) : null;

  const symbol = currencySymbols[selectedCurrency];

  let discount = 0;
  if(mrp && mrp > price){
    discount = Math.round(((mrp - price) / mrp) * 100);
  }

  document.getElementById("details").innerHTML = `
    <img src="${p.productImage || 'https://via.placeholder.com/300'}" width="300"><br><br>

    <h2>${p.name}</h2>
    <p><strong>Category:</strong> ${p.category}</p>
    <p>${p.description || ""}</p>

    <h3>
      ${symbol}${convertedPrice}
      ${convertedMrp ? `<span style="text-decoration:line-through;margin-left:10px;">${symbol}${convertedMrp}</span>` : ""}
      ${discount ? `<span style="color:red;margin-left:10px;">${discount}% OFF</span>` : ""}
    </h3>

    <p><strong>Stock:</strong> ${p.stock}</p>
    <p><strong>New:</strong> ${p.isNew ? "✅" : "❌"}</p>
    <p><strong>Surplus:</strong> ${p.isSurplus ? "✅" : "❌"}</p>

    <br>
    <button onclick="viewProduct('${p._id}')">View Details</button>
<button onclick="addToCart('${p._id}')">Add to Cart</button>

    <button onclick="addToCart('${p._id}')">Add To Cart</button>
    <button onclick="goBack()">Back</button>
  `;
})
.catch(()=> {
  document.getElementById("details").innerHTML = "Error loading product ❌";
});

}

function addToCart(productId){
  fetch(`${API}/cart/add`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      userId:"user123",
      productId,
      quantity:1
    })
  })
  .then(res=>res.json())
  .then(()=>alert("Added to cart ✅"));
}

function goBack(){
  window.location.href = "user.htm";
}
</script>

</body>
</html>
