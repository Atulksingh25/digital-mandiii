<body>

  <header>
  <h1>🌾 Farmer Customer App</h1>
</header>

<main style="text-align:center; padding:40px">
  <h2 id="msg">Checking login...</h2>
  <button onclick="goLogin()" id="loginBtn" style="display:none">Login</button>
</main>

<script>
  const role = localStorage.getItem("role");

  function goLogin() {
    location.href = "login.htm";
  }

  if (!role) {
    document.getElementById("msg").innerText = "Please login to continue";
    document.getElementById("loginBtn").style.display = "inline-block";
  } 
  else if (role === "admin") {
    location.href = "admin.htm";
  } 
  else {
    location.href = "user.htm";
  }
</script>

</body>
